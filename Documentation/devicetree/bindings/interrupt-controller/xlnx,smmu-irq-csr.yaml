%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/xlnx,smmu-irq-csr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx Versal NET SMMU CSR Interrupt Controller

maintainers:
  - Anirudha Sarangi <anirudha.sarangi@amd.com>
  - Tushar Nimkar <tushar.nimkar@amd.com>

description:
  The Versal Net platform includes a Xilinx-specific SMMU CSR (Control and
  Status Register) block that acts as an intermediate interrupt controller
  for ARM SMMUv3.

  This block provides registers to enable, disable, and clear the standard
  SMMUv3 interrupt sources, including EVENTQ, PRIQ, and GERROR.

  Xilinx Versal-Net SMMU CSR interrupt controller routes ARM SMMU interrupts
  through a vendor-specific SMMU_CSR register block. The block allows enabling
  and clearing of EVENTQ, PRIQ, and GERROR interrupts before forwarding
  them to the parent interrupt controller (typically GIC).

  The controller receives one parent interrupt, then demultiplexes CSR
  status bits into child interrupt IDs exposed by this irqchip domain
    0 - EVENTQ
    2 - GERROR (GLOBAL)
    3 - PRIQ

  Bit 1 (CMDQ_SYNC completion) is intentionally omitted, the Linux
  arm-smmu-v3 driver completes CMDQ_SYNC via polling or MSI and does not
  use a wired CMD_SYNC interrupt, so the binding exposes no child line
  for it.

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

properties:
  compatible:
    const: xlnx,versal-net-smmu-csr

  reg:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

  interrupts:
    maxItems: 1

  xlnx,smmu-csr-interrupt-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: >
      Bitmask selecting which SMMU CSR interrupt sources are enabled in the
      CSR block and forwarded to the parent interrupt controller. Each bit
      corresponds to a child interrupt line exposed by this controller:

        bit 0 - EVENTQ
        bit 1 - reserved (CMD_SYNC, not supported)
        bit 2 - GERROR
        bit 3 - PRIQ

    minimum: 0x0
    maximum: 0xd

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"
  - interrupts
  - xlnx,smmu-csr-interrupt-mask

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    smmu_irq_csr: interrupt-controller@eca10000 {
        compatible = "xlnx,versal-net-smmu-csr";
        reg = <0xeca10000 0x1000>;
        interrupt-controller;
        #interrupt-cells = <1>;
        interrupt-parent = <&gic>;
        interrupts = <GIC_SPI 169 IRQ_TYPE_LEVEL_HIGH>;
        xlnx,smmu-csr-interrupt-mask = <0x5>;
    };

    iommu@ec000000 {
        compatible = "arm,smmu-v3";
        reg = <0xec000000 0x40000>;
        #iommu-cells = <1>;
        dma-coherent;
        interrupt-names = "eventq", "gerror", "priq";
        interrupt-parent = <&smmu_irq_csr>;
        interrupts = <0>, <2>, <3>;
    };
