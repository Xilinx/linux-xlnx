%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/xlnx,clocking-wizard.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx clocking wizard

maintainers:
  - Shubhrajyoti Datta <shubhrajyoti.datta@amd.com>

description:
  The clocking wizard is a soft ip clocking block of Xilinx versal. It
  reads required input clock frequencies from the devicetree and acts as clock
  clock output.

properties:
  compatible:
    enum:
      - xlnx,clocking-wizard
      - xlnx,clocking-wizard-v5.2
      - xlnx,clocking-wizard-v6.0
      - xlnx,versal-clk-wizard


  reg:
    maxItems: 1

  "#clock-cells":
    const: 1

  clocks:
    minItems: 1
    items:
      - description: clock input
      - description: axi clock

  clock-names:
    minItems: 1
    items:
      - const: clk_in1
      - const: s_axi_aclk

  xlnx,static-config:
    $ref: /schemas/types.yaml#/definitions/flag
    description:
      Indicate whether the core has been configured without support for dynamic
      runtime reconfguration of the clocking primitive MMCM/PLL.

  xlnx,speed-grade:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 3]
    description:
      Speed grade of the device. Higher the speed grade faster is the FPGA device.

  xlnx,nr-outputs:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 8
    description:
      Number of outputs.

  xlnx,clk-mul-div:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    description:
      Fixed MMCM/PLL multiply/divide ratios, one (multiplier, divisor)
      pair per clock output relative to clk_in1. The number of entries
      must equal xlnx,nr-outputs.
    minItems: 1
    maxItems: 8
    items:
      items:
        - description: multiplier
          minimum: 1
        - description: divisor
          minimum: 1

required:
  - compatible
  - "#clock-cells"
  - clocks
  - clock-names
  - xlnx,speed-grade
  - xlnx,nr-outputs

allOf:
  - if:
      required:
        - xlnx,static-config
    then:
      required:
        - xlnx,clk-mul-div
    else:
      required:
        - reg
      properties:
        clocks:
          minItems: 2
        clock-names:
          minItems: 2

additionalProperties: false

examples:
  - |
    clock-controller@b0000000 {
        compatible = "xlnx,clocking-wizard";
        reg = <0xb0000000 0x10000>;
        #clock-cells = <1>;
        clocks = <&clkc 15>, <&clkc 18>;
        clock-names = "clk_in1", "s_axi_aclk";
        xlnx,nr-outputs = <6>;
        xlnx,speed-grade = <1>;
    };

  - |
    clock-controller {
        compatible = "xlnx,clocking-wizard";
        #clock-cells = <1>;
        clocks = <&clkc 15>;
        clock-names = "clk_in1";
        xlnx,nr-outputs = <6>;
        xlnx,speed-grade = <1>;
        xlnx,static-config;
        xlnx,clk-mul-div = <12 1>, <10 2>, <8 1>, <6 1>, <4 2>, <2 1>;
    };
...
