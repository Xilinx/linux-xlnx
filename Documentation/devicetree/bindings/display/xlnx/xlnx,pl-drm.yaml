%YAML 1.2
---
$id: http://devicetree.org/schemas/display/xlnx/xlnx,pl-drm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx PL Aggregate Display Device

maintainers:
  - Anatoliy Klymenko <anatoliy.klymenko@amd.com>

description:
  The PL display aggregate node represents a programmable logic (PL) compound
  display pipeline. Its child nodes describe the pipeline's video processing
  components, such as video timing controllers, signal sources, converters and
  sinks. This logical device combines the whole display pipeline into a single
  entity. This binding has been proposed as an RFC to the upstream community
  and the design may still change. See the RFC discussion at
  https://lore.kernel.org/dri-devel/20260925155658.3108388-1-vishal.sagar@amd.com/T/#u

properties:
  compatible:
    const: xlnx,pl-drm-1.0

  '#address-cells':
    enum: [1, 2]

  '#size-cells':
    enum: [1, 2]

  ranges: true

patternProperties:
  "^av-pat-gen@[0-9a-f]+$":
    type: object
    $ref: /schemas/display/xlnx/xlnx,psdpdc-av-pat-gen.yaml#
    description: AMD Versal Gen2 Audio / Video Pattern Generator child node.

  "^pl-disp(@[0-9a-f]+)?$":
    type: object
    $ref: /schemas/display/xlnx/xlnx,pl-disp.yaml#
    description: Xilinx PL display CRTC child node.

required:
  - compatible
  - '#address-cells'
  - '#size-cells'
  - ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    xlnx-pl-drm {
        compatible = "xlnx,pl-drm-1.0";
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        av-pat-gen@b0400000 {
            compatible = "xlnx,psdpdc-av-pat-gen-2.0";
            reg = <0xb0400000 0x10000>;
            clocks = <&misc_clk_2>, <&misc_clk_2>, <&misc_clk_1>, <&vid_clk 0>;
            clock-names = "aud_clk", "aud_out_axi4s_aclk",
                          "av_axi_aclk", "vid_out_axi4s_aclk";
            clk-enable-gpios = <&axi_gpio_0 0 GPIO_ACTIVE_HIGH>,
                               <&axi_gpio_0 1 GPIO_ACTIVE_HIGH>;
            xlnx,bridge = <&v_tc_0>;
            xlnx,ppc = <2>;
            xlnx,bpc = <8>;
            xlnx,video-format = <0>;

            port {
                avpg_out: endpoint {
                    remote-endpoint = <&dc_live_in_0>;
                };
            };
        };

        pl-disp {
            compatible = "xlnx,pl-disp";
            dmas = <&v_frmbuf_rd_0 0>;
            dma-names = "dma0";
            xlnx,vformat = "XR24";
            xlnx,bridge = <&v_tc_1>;
            clocks = <&vid_clk 0>;

            port {
                fb_read_out: endpoint {
                    remote-endpoint = <&dc_live_in_1>;
                };
            };
        };
    };
