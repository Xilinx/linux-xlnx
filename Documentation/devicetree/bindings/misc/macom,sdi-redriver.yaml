%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/macom,sdi-redriver.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MACOM SDI re-driver family

maintainers:
  - Katta Dhanunjanrao <katta.dhanunjanrao@amd.com>

description: |
  SPI-controlled SDI signal conditioning parts fitted to the Fidus/Zetta SDI
  FMC mezzanine.  Each is programmed over the same SPI bus and differs only in
  the role it plays in the signal chain:

    m23145  reclocker, used by both the Tx and Rx paths
    m23428  cable driver, used by the Tx path
    m23554  equalizer/receiver, used by the Rx path

  The parts have no readable configuration beyond a device-ID register, which
  selects which errata sequence applies to the die revision fitted.  Which role
  a given chip select plays is described by the mezzanine node's xlnx,rclkr,
  xlnx,drvr and xlnx,rcvr phandles rather than being inferred here.

  The controller must be able to issue 16-bit words: a register access is a
  single word carrying the address in bits [15:8] and the data in bits [7:0].

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    enum:
      - macom,m23145
      - macom,m23428
      - macom,m23554

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 10000000

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        reclocker@0 {
            compatible = "macom,m23145";
            reg = <0>;
            spi-max-frequency = <9300000>;
        };
    };
...
